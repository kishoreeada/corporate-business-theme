<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard | Stackly</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- ================= Sidebar ================= -->

      <aside class="sidebar">
        <div class="logo">
          <img src="images/stackly-logo (1).webp" alt="Stackly Logo" />
        </div>

        <nav>
          <ul class="menu">
            <li class="active">
              <a href="#" data-page="overview">
                <i class="fa-solid fa-chart-pie"></i>

                <span>Overview</span>
              </a>
            </li>

            <li>
              <a href="#" data-page="projects">
                <i class="fa-solid fa-folder-open"></i>

                <span>Projects</span>
              </a>
            </li>

            <li>
              <a href="#" data-page="clients">
                <i class="fa-solid fa-users"></i>

                <span>Clients</span>
              </a>
            </li>

            <li>
              <a href="#" data-page="reports">
                <i class="fa-solid fa-chart-line"></i>

                <span>Reports</span>
              </a>
            </li>

            <li>
              <a href="#" data-page="settings">
                <i class="fa-solid fa-gear"></i>

                <span>Settings</span>
              </a>
            </li>
          </ul>
        </nav>

        <button class="logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i>

          Logout
        </button>
      </aside>

      <!-- ================= Main Content ================= -->

      <main class="main-content">
        <!-- Header -->

        <header class="top-header">
          <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <h2 id="pageTitle">Dashboard</h2>
          </div>

          <div class="header-right">
            <button class="icon-btn">
              <i class="fa-regular fa-bell"></i>
            </button>

            <button class="icon-btn">
              <i class="fa-solid fa-user"></i>
            </button>
          </div>
        </header>

        <!-- Dynamic Content -->

        <section id="dashboardContent"></section>
      </main>
    </div>

    <!-- JavaScript -->

    <script src="js/dashboard.js"></script>
  </body>
</html>
